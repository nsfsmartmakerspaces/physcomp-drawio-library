schema_version: "1.0.0"
disable: false

name: "Net (right)"

placeholders:
  - x: 0
    y: 0
    width: 80
    height: 18
    horiz_align: right
    vert_align:  middle
    spacing: 2
    top_spacing: 0
    left_spacing: 0
    right_spacing: 0
    font_size: 16
    value: "EDIT ME"

custom:
  width: 90
  height: 20
  stencil: |
    <connections>
        <constraint name="net" perimeter="0" x="1" y="0.5"/>
    </connections>
    <foreground>
        <strokecolor color="#000000"/>
        <fillcolor color="#ffffff"/>
        <fontcolor color="#000000"/>
        <alpha alpha="1"/>
        <fontsize size="16"/>
        <fillstroke/>
        <path>
            <move x="90" y="10"/>
            <line x="80" y="0"/>
            <line x="0" y="0"/>
            <line x="0" y="20"/>
            <line x="80" y="20"/>
            <close/>
        </path>
        <stroke/>
    </foreground>
