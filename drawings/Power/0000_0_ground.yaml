schema_version: "1.0.0"
disable: false

name: "Ground (GND)"

# Modified from https://github.com/jgraph/drawio/blob/cd8fb3ab6bbfc949722444b1901771332b3387d3/src/main/webapp/stencils/electrical/signal_sources.xml
custom:
  width: 60
  height: 40
  stencil: |
    <connections>
        <constraint name="ground" perimeter="0" x="0.5" y="0"/>
    </connections>
    <foreground>
        <strokecolor color="#000000"/>
        <fillcolor color="#ffffff"/>
        <fontcolor color="#000000"/>
        <alpha alpha="1"/>
        <fontsize size="16"/>
        <path>
            <move x="5" y="20"/>
            <line x="30" y="40"/>
            <line x="55" y="20"/>
            <close/>
        </path>
        <fillstroke/>
        <path>
            <move x="30" y="0"/>
            <line x="30" y="20"/>
        </path>
        <stroke/>
    </foreground>
