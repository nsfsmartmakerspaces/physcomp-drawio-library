schema_version: "1.0.0"
disable: false

name: "VCC or VDD"

placeholders:
  - x: 0
    y: 0
    width: 60
    height: 20
    horiz_align: center
    vert_align: bottom
    spacing: 2
    top_spacing: 0
    left_spacing: 0
    right_spacing: 0
    font_size: 16
    value: "##V"

# Modified from https://github.com/jgraph/drawio/blob/cd8fb3ab6bbfc949722444b1901771332b3387d3/src/main/webapp/stencils/electrical/signal_sources.xml
custom:
  width: 60
  height: 40
  stencil: |
    <connections>
        <constraint name="V" perimeter="0" x="0.5" y="1"/>
    </connections>
    <foreground>
        <strokecolor color="#000000"/>
        <fillcolor color="#000000"/>
        <fontcolor color="#000000"/>
        <alpha alpha="1"/>
        <fontsize size="16"/>
        <path>
            <move x="5" y="20"/>
            <line x="55" y="20"/>
            <move x="30" y="20"/>
            <line x="30" y="40"/>
        </path>
        <stroke/>
    </foreground>
