schema_version: "1.0.0"
disable: false

name: "Light Emitting Diode (LED) [0894]"

placeholders:
  "color": "!COLOR!"

# Modified from https://github.com/jgraph/drawio/blob/cd8fb3ab6bbfc949722444b1901771332b3387d3/src/main/webapp/stencils/electrical/opto_electronics.xml
custom:
  width: 100
  height: 70
  stencil: |
    <connections>
        <constraint name="in" perimeter="0" x="0" y="0.57"/>
        <constraint name="out" perimeter="0" x="1" y="0.57"/>
    </connections>
    <background>
        <path>
            <move x="30" y="10"/>
            <line x="70" y="40"/>
            <line x="30" y="70"/>
            <close/>
        </path>
    </background>
    <foreground>
        <strokecolor color="#000000"/>
        <fillcolor color="#ffffff"/>
        <fontcolor color="#000000"/>
        <alpha alpha="1"/>
        <fontsize size="16"/>
        <fillstroke/>
        <path>
            <move x="0" y="40"/>
            <line x="30" y="40"/>
            <move x="70" y="10"/>
            <line x="70" y="70"/>
            <move x="80" y="12"/>
            <line x="87" y="5"/>
            <move x="87" y="8"/>
            <line x="87" y="5"/>
            <line x="84" y="5"/>
            <move x="75" y="7"/>
            <line x="82" y="0"/>
            <move x="82" y="3"/>
            <line x="82" y="0"/>
            <line x="79" y="0"/>
            <move x="70" y="40"/>
            <line x="100" y="40"/>
        </path>
        <fontsize size="8"/>
        <text str="%color%" x="2" y="42" align="left" valign="top" placeholders="1"/>
        <text str="#0894" x="98" y="42" align="right" valign="top" placeholders="1"/>
        <stroke/>
    </foreground>
