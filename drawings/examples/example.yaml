schema_version: "1.0.0"

# Prevent this schema from actually being generating
disable: true

# Add indent to the top. Cannot be used with top pins
dip: false

# Put text on leads and add arrows (left in, right out)
# Cannot be used with top or bottom pins
block: false

# Which style to use, defined in styles folder
# These styles define spacing, sizing, etc.
style: chip_1

# This name appears in the library selection section
name: "Example"

# Unfortunately there is no text-wrapping in drawings,
# so every line must be broken out manually
title:
  - "Cool Chip"
  - "123"
  - "%customValue%"

# Add text to the bottom right of the drawing. In dip
# mode the text is in the bottom center
bottom_text:
  - "BOTTOM TEXT"

# Placeholders provide user-configurable text values.
placeholders:
  - x: 50
    y: 0
    width: 100
    height: 20
    horiz_align: center
    vert_align: bottom
    spacing: 2
    top_spacing: 0
    left_spacing: 0
    right_spacing: 0
    font_size: 16
    value: "DOUBLE CLICK TO CHANGE ME!"

# To disable any side of the chip, comment out or remove
# that entire section.
#
# Empty strings will cause a position to be skipped to
# allow for manual spacing (no text or lead). Example:
# top:
#   - "Pin 1"
#   - ""
#   - "Pin 2"
#
# Multiline pins are lists within lists. Block mode has
# a maximum of two lines per pin (one above and one
# below). Example:
# left:
#   - - "A1"
#     - "Cool pin"
#   - "A2"
#
# Placeholder on pins can be added make adding a placeholder
# key. The value is the initial placeholder text. This also
# works on lines if you only want a placeholder on one line.

left:
  - - "A1"
    - "Cool pin"
  - "A2"
  - "A3"
  - ""
  - "SDA"
  - placeholder: "EDIT ME"
top:
  - "5V"
  - - "Vin"
    - "(jack)"
right:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  - "6"
  - "7"
bottom:
  - - "GND"
    - "(jack)"
    - placeholder: "EDIT ME TOO"
  - "GND"
