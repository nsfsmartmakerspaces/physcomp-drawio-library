name: physcomp-drawio-library

on:
  push:
    branches:
      - '*'
      - '!gh-pages'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
      - name: Install core Python and pip dependencies
        run: "python -m pip install --upgrade pip setuptools wheel"
      - name: Install package
        run: "pip3 install -e ."
      - name: Run physcomp_drawio_generate
        run: "python3 -m \"physcomp_drawio_generate\""
      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: "dist-${{ github.run_id }}"
          path: "dist-${{ github.run_id }}"
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout gh-pages branch of repo
        uses: actions/checkout@v2
        with:
          ref: "gh-pages"
      # - name: Clear branch of previous build
      #   run: |
      #     git rm -rf . --ignore-unmatch
      #     git clean -fxd
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: "dist-${{ github.run_id }}"
      - name: Commit and push new artifact
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add . --all
          git commit -m "physcomp-drawio-library publish $GITHUB_SHA"
          git push

