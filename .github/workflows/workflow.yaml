name: physcomp-drawio-library

on:
  push:
    branches:
      - '*'
      - '!gh-pages'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
      - name: Set up Python 3.x
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"
          architecture: "x64"
      - name: Install core Python and pip dependencies
        run: "python -m pip install --upgrade pip setuptools wheel"
      - name: Install package
        run: "pip3 install -e ."
      - name: Run physcomp_drawio_generate
        run: "python3 -m \"physcomp_drawio_generate\""
      - name: Upload built artifact
        uses: actions/upload-artifact@v2
        with:
          name: "dist"
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          ref: "gh-pages"
          path: "dist"
      - name: Remove previous build
        run: |
          cd dist
          git rm -rf .
          git clean -fxd
          cd ../
      - name: Download build artifact
        uses: actions/download-artifact@v2
        with:
          name: "dist"
      - name: Commit and push new artifacts
        run: |
          cd dist
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add . --all
          git commit -m "physcomp-drawio-library publish $GITHUB_SHA"
          git push
          cd ../

